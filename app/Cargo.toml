[package]
name = "focus-dns"
version = "0.1.0"
edition = "2021"
default-run = "focus-dns"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
focus-telemetry = { path = "../telemetry" }
focus-browser-host = { path = "../browser-host", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
boa_engine = { version = "0.21", default-features = false }
url = "2"

[target.'cfg(windows)'.dependencies]
focus-devices = { path = "../devices" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ring = "0.17"
regex = "1"
sha2 = "0.10"
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Com",
  "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_System_Power",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
