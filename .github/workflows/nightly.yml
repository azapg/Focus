name: Nightly checks and release

on:
  pull_request:
  schedule:
    # Every 6 hours, off the busy top of the hour. The plan job skips it when main is already published.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      android: ${{ steps.plan.outputs.android }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Choose what to run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          windows=false android=false release=false
          case "$EVENT" in
            pull_request)
              # A failed request fails this job rather than skipping checks. Renames list both paths.
              gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
              # The APK also bundles Peek, the shared sources and the judge's prompt and services.
              if grep -E '^(\.github/|\.cargo/|android/|shared/|telemetry/|browser-host/|scripts/updater-repo\.sh$|app/src/(judge_prompt\.txt|services\.json)$)' files.txt \
                  | grep -vE '\.md$' > /dev/null; then
                android=true
              fi
              # The desktop UI bundles the judge icons from the Android resources.
              if grep -E '^android/res/drawable-nodpi/judge_' files.txt > /dev/null \
                  || grep -vE '\.md$|^(android|tv|docs|shared/android|telemetry/android)/' files.txt > /dev/null; then
                windows=true
              fi
              # GitHub lists at most 3,000 files, so a longer list may be incomplete.
              if [ "$(wc -l < files.txt)" -ge 3000 ]; then windows=true android=true; fi
              ;;
            schedule)
              mkdir -p published
              gh release download nightly -p nightly.json -p android-nightly.json -D published || true
              for manifest in nightly.json android-nightly.json; do
                commit="$(jq -er .commit_sha "published/$manifest" 2> /dev/null)" || commit=nothing
                echo "$manifest: published $commit, main $SHA"
                if [ "$commit" != "$SHA" ]; then release=true; fi
              done
              # An interrupted upload can leave a manifest that doesn't match its binary.
              gh api "repos/$GH_REPO/releases/tags/nightly" \
                --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.digest)"' > assets.txt || true
              {
                jq -r '.assets | .app, .bridge | "\(.name) sha256:\(.sha256)"' published/nightly.json || echo invalid
                jq -r '.apk | "\(.name) sha256:\(.sha256)"' published/android-nightly.json || echo invalid
              } > expected.txt
              while IFS= read -r asset; do
                if ! grep -xF "$asset" assets.txt > /dev/null; then
                  echo "not published: $asset"
                  release=true
                fi
              done < expected.txt
              windows=$release android=$release
              ;;
            workflow_dispatch)
              windows=true android=true
              if [ "$GITHUB_REF" = refs/heads/main ]; then release=true; fi
              ;;
          esac
          printf 'windows=%s\nandroid=%s\nrelease=%s\n' "$windows" "$android" "$release" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Checks
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            browser-host
            devices
            app

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript tests and build UI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path browser-host/Cargo.toml
          cargo test --manifest-path devices/Cargo.toml
          cargo build --manifest-path browser-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FOCUS_PEEK_WORKER = (Resolve-Path browser-host/target/debug/focus-browser-host.exe).Path
          cargo test --manifest-path app/Cargo.toml

      - name: Replay synthetic focus history
        shell: pwsh
        run: |
          $signature = Join-Path $env:RUNNER_TEMP "focus-replay-signature"
          $work = Join-Path $env:RUNNER_TEMP "focus-replay-work"
          node tests/fixtures/focus-detector-replay.mjs $signature signature
          node tests/fixtures/focus-detector-replay.mjs $work work
          $driftOutput = cargo run --manifest-path app/Cargo.toml --bin focus-replay -- $signature
          $driftOutput
          if ($LASTEXITCODE -ne 0 -or "$driftOutput" -notmatch "Drifting . Unfocused") {
            throw "Expected the drift signature to reach unfocused"
          }
          $workOutput = cargo run --manifest-path app/Cargo.toml --bin focus-replay -- $work
          $workOutput
          if ($LASTEXITCODE -ne 0 -or "$workOutput" -notmatch "(?<![0-9])0 focus transitions") {
            throw "Expected the work fixture to stay focused"
          }

  android-checks:
    name: Android checks
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Android unit tests
        run: bash android/test.sh

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request'
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'pull_request'
        with:
          shared-key: android-arm64
          workspaces: android/peek-native

      - name: Install Android NDK
        if: github.event_name == 'pull_request'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"'

      - name: Build and check Android APK
        if: github.event_name == 'pull_request'
        run: |
          bash android/build.sh
          python3 android/check-release-apk.py android/build/focus-phone.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: focus-phone-pr
          path: |
            android/build/focus-phone.apk
            android/build/android-nightly.json
          if-no-files-found: error

  nightly-release:
    name: Publish nightly release
    env:
      FOCUS_UPDATER_REPO: ${{ github.repository }}
    needs: [plan, checks, android-checks]
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            browser-host
            devices
            app

      - name: Build UI bundle
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --no-audit --no-fund
          npm run build

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          $fullSha = (git rev-parse HEAD).Trim()
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $subject = (git log -1 --pretty=%s).Trim()

          $env:FOCUS_BUILD_ID = $shortSha
          $env:FOCUS_COMMIT_SHA = $fullSha
          $env:FOCUS_BUILT_AT = $builtAt

          "FOCUS_BUILD_ID=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOCUS_COMMIT_SHA=$fullSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOCUS_BUILT_AT=$builtAt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOCUS_COMMIT_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Append

          cargo build --release --manifest-path browser-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FOCUS_PEEK_WORKER = (Resolve-Path browser-host/target/release/focus-browser-host.exe).Path
          cargo build --release --manifest-path app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write release notes
        shell: pwsh
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Summarize everything merged since the last nightly (Claude Haiku via AI Gateway, $1/month cap).
          # Falls back to commit subjects without a key, so a release never waits on the summary.
          New-Item -ItemType Directory -Force release-stage | Out-Null
          $prev = ""
          gh release download nightly -p nightly.json -O prev-nightly.json --clobber 2>$null
          if (Test-Path prev-nightly.json) {
            try { $prev = (Get-Content prev-nightly.json -Raw | ConvertFrom-Json).commit_sha } catch { $prev = "" }
          }
          node scripts/release-notes.mjs --from "$prev" --to HEAD --out release-stage/notes.json

      - name: Sign nightly manifest
        shell: pwsh
        env:
          FOCUS_UPDATER_SIGNING_KEY: ${{ secrets.FOCUS_UPDATER_SIGNING_KEY }}
        run: |
          if (-not $env:FOCUS_UPDATER_SIGNING_KEY) {
            throw "FOCUS_UPDATER_SIGNING_KEY repository secret is missing."
          }
          New-Item -ItemType Directory -Force release-stage | Out-Null
          Copy-Item app/target/release/focus-dns.exe release-stage/FocusDNS.exe -Force
          Copy-Item browser-host/target/release/focus-browser-host.exe release-stage/focus-browser-host.exe -Force

          node scripts/sign-nightly.mjs sign `
            --app release-stage/FocusDNS.exe `
            --bridge release-stage/focus-browser-host.exe `
            --commit $env:FOCUS_COMMIT_SHA `
            --build-id $env:FOCUS_BUILD_ID `
            --published-at $env:FOCUS_BUILT_AT `
            --notes release-stage/notes.json `
            --out release-stage/nightly.json

          node scripts/sign-nightly.mjs verify `
            --manifest release-stage/nightly.json `
            --pubkey dc8d2fc1600cf9ecbf92395031ae3e36ef227bccfb4f1c74aac90f29aa037187 `
            --app release-stage/FocusDNS.exe `
            --bridge release-stage/focus-browser-host.exe

      - name: Publish rolling nightly GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rn = Get-Content release-stage/notes.json -Raw | ConvertFrom-Json
          $bullets = @($rn.items | ForEach-Object { if ($_[1]) { "- **$($_[0]).** $($_[1])" } else { "- $($_[0])" } })
          $notes = @(
            "Automated nightly build from ``main``."
            ""
          ) + $bullets + @(
            $(if ($rn.more) { $rn.more } else { "" })
            ""
            "Build ``$env:FOCUS_BUILD_ID`` (``$env:FOCUS_COMMIT_SHA``) · built $env:FOCUS_BUILT_AT"
          ) -join "`n"

          gh release view nightly *> $null
          if ($LASTEXITCODE -ne 0) {
            # Upload binaries first, then nightly.json last so clients never see a manifest before binaries exist.
            gh release create nightly `
              release-stage/FocusDNS.exe `
              release-stage/focus-browser-host.exe `
              --title "Nightly ($env:FOCUS_BUILD_ID)" `
              --notes $notes `
              --prerelease `
              --target $env:FOCUS_COMMIT_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload nightly release-stage/notes.json --clobber
            gh release upload nightly release-stage/nightly.json --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release upload nightly `
              release-stage/FocusDNS.exe `
              release-stage/focus-browser-host.exe `
              --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload nightly release-stage/notes.json --clobber
            gh release upload nightly release-stage/nightly.json --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit nightly `
              --title "Nightly ($env:FOCUS_BUILD_ID)" `
              --notes $notes `
              --prerelease `
              --target $env:FOCUS_COMMIT_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  android-nightly:
    name: Publish Android nightly APK
    needs: [plan, android-checks, nightly-release]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
          workspaces: android/peek-native

      - name: Install Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"'

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nightly -p notes.json -O "$GITHUB_WORKSPACE/notes.json" --clobber || echo "no notes yet"

      - name: Build and sign Android nightly APK
        env:
          FOCUS_UPDATER_REPO: ${{ github.repository }}
          NOTES_FILE: ${{ github.workspace }}/notes.json
          FOCUS_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOCUS_ANDROID_KEYSTORE_BASE64 }}
          FOCUS_ANDROID_KEYSTORE_PASS: ${{ secrets.FOCUS_ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$FOCUS_ANDROID_KEYSTORE_BASE64" ] || [ -z "$FOCUS_ANDROID_KEYSTORE_PASS" ]; then
            echo "FOCUS_ANDROID_KEYSTORE_BASE64 and FOCUS_ANDROID_KEYSTORE_PASS repository secrets are required." >&2
            exit 1
          fi
          bash android/build.sh

      - name: Verify Android nightly APK before publishing
        run: python3 android/check-release-apk.py android/build/focus-phone.apk

      - name: Upload Android APK and manifest to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload APK first, then android-nightly.json last so phones never see a manifest before the APK exists.
          gh release upload nightly android/build/focus-phone.apk --clobber
          gh release upload nightly android/build/android-nightly.json --clobber
