name: Branch native Store captures

on:
  push:
    branches:
      - t3/native-store-walkthroughs
    paths:
      - .github/workflows/native-capture-branch.yml
      - android/**
      - shared/android/**
      - tv/**
      - scripts/screenshot.py
      - tests/screenshot_emulator.py

permissions:
  contents: read
  actions: write

concurrency:
  group: native-store-captures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/t3/native-store-walkthroughs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM when the hosted runner provides it
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo 'This runner does not provide KVM.' >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build and emulator images
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;36.1.0' \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;default;x86_64'

      - name: Capture fictional phone and TV Store flows offline
        env:
          FOCUS_SCREENSHOT_KEEP_FAILED: '1'
        run: |
          set -euo pipefail
          parent_net="$(readlink /proc/self/ns/net)"
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            env FOCUS_SCREENSHOT_PARENT_NET="$parent_net" \
            python3 scripts/screenshot.py phone-store-zero \
            --sdk "$ANDROID_HOME" \
            --image system-images/android-35/default/x86_64 \
            --out build/native-captures/phone
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            env FOCUS_SCREENSHOT_PARENT_NET="$parent_net" \
            python3 scripts/screenshot.py tv-store \
            --sdk "$ANDROID_HOME" \
            --image system-images/android-35/default/x86_64 \
            --out build/native-captures/tv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-store-captures-${{ github.sha }}
          path: build/native-captures/
          if-no-files-found: warn
          retention-days: 1
