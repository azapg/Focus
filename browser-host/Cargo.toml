[package]
name = "focus-browser-host"
version = "0.1.0"
edition = "2021"

[features]
default = ["peek"]
peek = ["dep:base64", "dep:image", "dep:percent-encoding", "dep:reqwest", "dep:scraper", "dep:tokio", "dep:xeet-core", "dep:xeet-resolve"]

[dependencies]
focus-telemetry = { path = "../telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
url = "2"
base64 = { version = "0.22", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
percent-encoding = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"], optional = true }
scraper = { version = "0.24", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
xeet-core = { git = "https://github.com/rauchg/xeet", rev = "095ba15047fe5111bd93c64a726c027eb9794960", optional = true }
xeet-resolve = { git = "https://github.com/rauchg/xeet", rev = "095ba15047fe5111bd93c64a726c027eb9794960", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
