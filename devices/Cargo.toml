[package]
name = "focus-devices"
version = "0.1.0"
edition = "2021"

[features]
portable-test-harness = []

[dependencies]
focus-telemetry = { path = "../telemetry" }
focus-browser-host = { path = "../browser-host", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mdns-sd = "0.21.4"
getrandom = "0.2"
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
