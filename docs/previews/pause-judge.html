<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusDNS pause judge prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground, #f5f5f5); font: 14px/1.4 system-ui, sans-serif; }
  main { display: grid; gap: 16px; max-width: 820px; margin-inline: auto; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 19px; font-weight: 650; }
  h2 { font-size: 13px; font-weight: 600; color: var(--foreground, #dedede); }
  label { font-weight: 600; }
  button, select, input, textarea { color: inherit; font: inherit; }
  button, select {
    padding: 8px 12px; border: 1px solid #303033; border-radius: 6px;
    background: #19191b; cursor: pointer;
  }
  button:disabled { color: #96969b; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, .grab:focus-visible {
    outline: 2px solid #dededf; outline-offset: 2px;
  }
  .sample-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .device-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
  .device { display: grid; align-content: start; gap: 8px; min-width: 0; }
  .surface {
    display: grid; grid-template-rows: 39px minmax(0, 1fr);
    height: 484px; border: 1px solid #27272a; border-radius: 12px;
    background: #000; color: #f5f5f5; overflow: hidden;
  }
  .laptop .surface { height: 420px; }
  .launch-row { display: flex; align-items: center; justify-content: center; margin: 7px 8px 0; }
  .launch { padding: 4px 13px; background: #141414; border-color: #2b2b2b; font-size: 12px; }
  .phone .launch-row { justify-content: flex-end; padding-inline: 7px; }
  .phone .launch { background: #151517; }
  .sheet {
    --sheet-height: 362px;
    width: calc(100% - 16px); height: var(--sheet-height); min-width: 0;
    display: grid; grid-template-rows: 12px auto 60px 35px minmax(0, 1fr); gap: 9px;
    padding: 12px; border: 1px solid #27272b; border-radius: 11px;
    background: #101012; overflow: hidden;
  }
  .laptop .sheet { justify-self: center; align-self: start; margin-top: 6px; }
  .phone .sheet {
    width: 100%; align-self: end; justify-self: stretch; border-bottom: 0;
    border-radius: 23px 23px 0 0; padding: 12px 15px;
  }
  .surface:not([data-open]) .sheet { visibility: hidden; }
  .grab {
    width: 100%; height: 15px; display: grid; place-items: start center;
    touch-action: none; cursor: grab; user-select: none;
  }
  .grab::after { content: ""; width: 32px; height: 3px; border-radius: 2px; background: #424247; }
  textarea, input {
    width: 100%; min-width: 0; border-radius: 7px; border: 1px solid #2e2e33;
    padding: 8px 9px; background: #080809;
  }
  textarea { resize: none; }
  .ask { width: 100%; font-weight: 630; padding-block: 5px; }
  .answer {
    min-height: 0; display: grid; gap: 7px; grid-template-rows: minmax(0, 1fr) 36px 35px;
    border-top: 1px solid #27272b; padding-top: 9px;
  }
  .decision { display: grid; align-content: start; gap: 4px; }
  .plan, .secondary, .action-row { grid-column: 1; }
  .plan, .action-row { grid-row: 2; }
  .answer[data-attention] .action-row, .secondary { grid-row: 3; }
  .decision h3 { font-size: 14px; font-weight: 650; }
  .decision p { color: #adadb1; font-size: 13px; }
  .action { height: 35px; width: 100%; padding: 5px 6px; font-weight: 620; }
  .secondary { color: #b9b9bd; background: transparent; border-color: transparent; font-weight: 500; }
  [data-attention] .decision h3 { color: #ffad72; }
  [data-action="hold"] { touch-action: none; user-select: none; }
  [hidden] { visibility: hidden; }
  @media (max-width: 650px) {
    .device-grid { grid-template-columns: minmax(0, 1fr); }
    .laptop .sheet { max-width: 420px; }
    .phone .surface { width: min(100%, 415px); }
    .phone .sheet { width: 100%; }
  }
  @media (max-width: 360px) {
    .sheet { --sheet-height: 380px; }
    .laptop .surface { height: 438px; }
  }
</style>
</head>
<body>
<main>
  <h1>Pause judge prototype</h1>
  <div class="sample-bar">
    <label for="sample">Sample request</label>
    <select id="sample">
      <option value="">Choose a sample</option>
    </select>
  </div>
  <div class="device-grid" id="devices"></div>
</main>

<template id="device-template">
  <section class="device">
    <h2></h2>
    <div class="surface">
      <div class="launch-row"><button class="launch" type="button" aria-expanded="false">Ask to pause</button></div>
      <form class="sheet" aria-label="Pause request">
        <div class="grab" tabindex="0" aria-label="Swipe to dismiss"></div>
        <label>What do you need?</label>
        <textarea rows="2" maxlength="2000"></textarea>
        <button class="ask" type="submit" disabled>Ask</button>
        <div class="answer">
          <div class="decision" aria-live="polite"><h3></h3><p></p></div>
          <input class="plan" type="text" aria-label="What will you do after the pause?" placeholder="What will you do after the pause?" hidden>
          <div class="action-row"></div>
        </div>
      </form>
    </div>
  </section>
</template>

<script>
  const scenarios = {
    discord: { name: "Discord only", request: "I need to share a link on Discord.",
      title: "Discord only · 5 min", action: "Open Discord for 5 min", follow: "scope" },
    full: { name: "Full pause", request: "I need to open several work sites for a call. They aren’t in the service list.",
      title: "Full pause · 5 min", action: "Hold 2s to pause", follow: "hold" },
    peek: { name: "Peek", request: "I need to see this post: https://x.com/example/status/1234567890",
      title: "Peek at one post", action: "View post", follow: "peek" },
    offer: { name: "Counter-offer", request: "I’m stuck on my draft. Can I scroll X for a bit?",
      title: "Spend 10 minutes on your draft", detail: "Write the first three lines before taking a break." },
    deny: { name: "Denied", request: "Unblock X so I can scroll. I don’t have anything in mind.",
      title: "Keep X blocked", detail: "No task needs an exception." },
    override: { name: "Override", request: "I want to open my feed while I wait for my meeting.",
      title: "Keep the feed blocked", detail: "Your meeting doesn’t need it." },
    offline: { name: "Offline fallback", request: "I need to check a message and the judge is offline.",
      title: "Judge unavailable", action: "Hold 3s for a 1-minute pause", follow: "hold" }
  };

  function chooseScenario(request) {
    for (const [key, value] of Object.entries(scenarios)) {
      if (request === value.request) return key;
    }
    if (/https?:\/\/(?:www\.)?x\.com\/[^\s]+\/status\//i.test(request)) return "peek";
    if (/\bdiscord\b/i.test(request)) return "discord";
    if (/\boffline\b/i.test(request)) return "offline";
    if (/\b(stuck|distracted|bored)\b/i.test(request)) return "offer";
    return "deny";
  }

  function mountDevice(kind, label) {
    const device = document.getElementById("device-template").content.firstElementChild.cloneNode(true);
    device.classList.add(kind);
    device.querySelector("h2").textContent = label;
    document.getElementById("devices").append(device);
    const surface = device.querySelector(".surface");
    const launch = device.querySelector(".launch");
    const sheet = device.querySelector(".sheet");
    const grab = device.querySelector(".grab");
    const request = device.querySelector("textarea");
    const ask = device.querySelector(".ask");
    const answer = device.querySelector(".answer");
    const title = answer.querySelector("h3");
    const detail = answer.querySelector("p");
    const plan = answer.querySelector(".plan");
    const actionRow = answer.querySelector(".action-row");
    const primary = document.createElement("button");
    const secondary = document.createElement("button");
    primary.type = secondary.type = "button";
    primary.className = "action";
    secondary.className = "action secondary";
    actionRow.append(primary);
    plan.after(secondary);
    request.id = kind + "-request";
    sheet.querySelector("label").htmlFor = request.id;
    let responseTimer;
    let holdTimer;
    let waitTimer;
    let gesture;
    let accessUntil = 0;
    let accessTimer;

    function updateAsk() {
      request.disabled = accessUntil !== 0;
      ask.disabled = accessUntil !== 0 || responseTimer != null || request.value.trim().length < 3;
    }

    function clearOutcome() {
      clearTimeout(responseTimer);
      clearTimeout(holdTimer);
      clearInterval(waitTimer);
      responseTimer = holdTimer = waitTimer = null;
      title.textContent = detail.textContent = "";
      delete answer.dataset.attention;
      plan.value = "";
      plan.hidden = primary.hidden = secondary.hidden = true;
      primary.disabled = false;
      ask.textContent = "Ask";
      updateAsk();
    }

    function open() {
      surface.dataset.open = "";
      launch.setAttribute("aria-expanded", "true");
    }

    function dismiss() {
      delete surface.dataset.open;
      launch.setAttribute("aria-expanded", "false");
      if (!accessUntil) {
        request.value = "";
        clearOutcome();
      }
      launch.focus();
    }

    function showOutcome(heading, message = "") {
      title.textContent = heading;
      detail.textContent = message;
    }

    function action(button, label, activate) {
      button.hidden = false;
      button.textContent = label;
      button.onclick = activate;
    }

    function access(heading, minutes, stopLabel) {
      clearOutcome();
      resetPrimaryEvents();
      accessUntil = Date.now() + minutes * 60000;
      updateAsk();
      launch.textContent = heading;
      showOutcome(heading);
      const end = () => {
        clearTimeout(accessTimer);
        accessUntil = 0;
        launch.textContent = "Ask to pause";
        clearOutcome();
        if (surface.hasAttribute("data-open")) showOutcome("Protection restored");
      };
      action(primary, stopLabel, end);
      accessTimer = setTimeout(end, minutes * 60000);
    }

    function holdForPause(seconds, minutes, fallback) {
      primary.dataset.action = "hold";
      secondary.hidden = true;
      plan.hidden = !fallback;
      const holdLabel = fallback ? "Hold 3s for a 1-minute pause" : "Hold 2s to pause";
      action(primary, holdLabel, null);
      const waitUntil = Date.now() + (fallback ? 5000 : 0);
      function updateHold() {
        const wait = Math.max(0, Math.ceil((waitUntil - Date.now()) / 1000));
        primary.disabled = wait > 0 || (fallback && plan.value.trim().length < 3);
        if (holdTimer == null) primary.textContent = wait ? "Wait " + wait + "s" : holdLabel;
        if (!wait) clearInterval(waitTimer);
      }
      plan.oninput = updateHold;
      waitTimer = setInterval(updateHold, 200);
      updateHold();

      primary.onpointerdown = (event) => {
        if (event.button !== 0 || primary.disabled) return;
        primary.setPointerCapture(event.pointerId);
        beginHold();
      };
      primary.onkeydown = (event) => {
        if (event.key !== " " && event.key !== "Enter") return;
        event.preventDefault();
        if (!event.repeat && !primary.disabled) beginHold();
      };
      primary.onpointerup = primary.onpointercancel = primary.onlostpointercapture = primary.onkeyup = primary.onblur = () => {
        if (holdTimer == null) return;
        clearTimeout(holdTimer);
        holdTimer = null;
        primary.textContent = holdLabel;
      };
      function beginHold() {
        if (holdTimer != null) return;
        primary.textContent = "Keep holding…";
        holdTimer = setTimeout(() => {
          holdTimer = null;
          access("Full pause active", minutes, "Turn protection back on");
        }, seconds * 1000);
      }
    }

    function resetPrimaryEvents() {
      delete primary.dataset.action;
      primary.onpointerdown = primary.onpointerup = primary.onpointercancel = primary.onlostpointercapture = null;
      primary.onkeydown = primary.onkeyup = primary.onblur = null;
    }

    function displayDecision(key) {
      resetPrimaryEvents();
      const current = scenarios[key];
      showOutcome(current.title, current.detail);
      if (key !== "full" && key !== "offline") {
        action(secondary, "I still need a full pause", () => {
          showOutcome("Full pause override · 5 min");
          answer.dataset.attention = "";
          holdForPause(2, 5, false);
        });
      }
      if (current.follow === "scope") {
        action(primary, current.action, () => access("Discord open · 5 min", 5, "End scoped pause"));
      } else if (current.follow === "peek") {
        action(primary, current.action, () => {
          primary.hidden = secondary.hidden = true;
          showOutcome("Example post", "The 3 p.m. meetup moved to the small room upstairs.");
        });
      } else if (current.follow === "hold") {
        answer.dataset.attention = "";
        holdForPause(key === "offline" ? 3 : 2, key === "offline" ? 1 : 5, key === "offline");
      }
    }

    function submit(event) {
      event?.preventDefault();
      const text = request.value.trim();
      if (text.length < 3 || responseTimer != null || accessUntil) return;
      clearOutcome();
      resetPrimaryEvents();
      ask.textContent = "Checking…";
      responseTimer = setTimeout(() => {
        responseTimer = null;
        ask.textContent = "Ask";
        updateAsk();
        displayDecision(chooseScenario(text));
      }, 480);
      updateAsk();
    }

    launch.onclick = () => {
      open();
      if (accessUntil) {
        primary.focus();
      } else {
        request.focus();
      }
    };
    request.oninput = () => { if (!accessUntil) clearOutcome(); };
    sheet.onsubmit = submit;

    sheet.addEventListener("keydown", (event) => { if (event.key === "Escape") dismiss(); });
    const isControl = (event) => event.target.closest("button, input, textarea");
    sheet.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || isControl(event)) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
      sheet.setPointerCapture(event.pointerId);
    });
    sheet.addEventListener("pointerup", (event) => {
      if (gesture?.id !== event.pointerId) return;
      const dx = event.clientX - gesture.x;
      const dy = event.clientY - gesture.y;
      gesture = null;
      if (dy > 42 || (kind === "laptop" && (dy < -42 || Math.abs(dx) > 54))) {
        dismiss();
      }
    });
    sheet.addEventListener("pointercancel", () => { gesture = null; });

    function loadSample(key, view) {
      clearTimeout(accessTimer);
      accessUntil = 0;
      launch.textContent = "Ask to pause";
      clearOutcome();
      resetPrimaryEvents();
      request.value = scenarios[key]?.request ?? "";
      open();
      updateAsk();
      if (view === "decision") displayDecision(key);
      if (view === "override") {
        displayDecision(key);
        secondary.click();
      }
      if (view === "loading") {
        submit();
      }
    }

    clearOutcome();
    open();
    return { loadSample };
  }

  const devices = {
    laptop: mountDevice("laptop", "Windows laptop"),
    phone: mountDevice("phone", "Android phone")
  };
  const sample = document.getElementById("sample");
  for (const [key, scenario] of Object.entries(scenarios)) sample.add(new Option(scenario.name, key));
  sample.onchange = () => Object.values(devices).forEach((device) => device.loadSample(sample.value));

  const preview = new URLSearchParams(location.search);
  const preset = preview.get("sample");
  const view = preview.get("view");
  if (Object.hasOwn(scenarios, preset)) {
    sample.value = preset;
    Object.values(devices).forEach((device) => device.loadSample(preset, view));
  }
  const only = preview.get("device");
  if (Object.hasOwn(devices, only)) {
    const removed = document.querySelector(".device:not(." + only + ")");
    removed.remove();
    document.getElementById("devices").style.gridTemplateColumns = "minmax(0, 1fr)";
  }
</script>
</body>
</html>
