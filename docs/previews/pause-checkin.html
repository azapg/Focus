<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusDNS · Pause feedback preview</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.45 system-ui, sans-serif;
      color: #f4f4f5;
      background: #080809;
      --surface: #101012;
      --raised: #18181b;
      --line: #2c2c30;
      --muted: #a4a4aa;
      --amber: #ffb756;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { max-width: 1100px; margin: auto; padding: clamp(24px, 6vw, 72px) 24px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(29px, 5vw, 49px); letter-spacing: -.055em; line-height: 1.1; }
    h2 { font-size: 19px; letter-spacing: -.025em; }
    h3 { font-size: 15px; }
    header p { color: var(--muted); margin-top: 8px; }
    button, input, select { font: inherit; }
    button {
      color: inherit; background: var(--raised); border: 1px solid var(--line);
      border-radius: 9px; padding: 9px 13px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #232326; }
    button:disabled { opacity: .46; cursor: default; }
    :focus-visible { outline: 2px solid #c6bfff; outline-offset: 3px; }
    .devices, .options, .scores, .row { display: flex; gap: 8px; align-items: center; }
    .devices { margin: 25px 0 14px; }
    .options { flex-wrap: wrap; }
    .flat { border: 0; background: transparent; color: var(--muted); border-radius: 4px; }
    .flat[aria-pressed="true"] { color: #fff; text-decoration: underline; text-underline-offset: 5px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 15px; }
    .screen, .stats { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 22px; min-width: 0; }
    .screen { position: relative; min-height: 440px; }
    .row { justify-content: space-between; }
    #network { color: var(--muted); }
    #network[data-paused] { color: var(--amber); }
    form { display: grid; gap: 16px; margin-top: 29px; align-content: start; }
    .field { display: grid; gap: 6px; }
    .field > label, .field > span { color: var(--muted); font-size: 13px; }
    .field .options { gap: 2px 4px; }
    .field .flat { padding: 7px 6px; }
    input, select {
      width: 100%; color: inherit; border: 1px solid var(--line); border-radius: 8px;
      background: #0d0d0f; padding: 10px 11px;
    }
    select { width: auto; max-width: 100%; }
    .primary { background: #28282c; font-weight: 600; }
    .running { margin-top: 29px; display: grid; gap: 13px; justify-items: start; }
    .end-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .toast, .notification {
      position: absolute; z-index: 1; right: 14px; bottom: 14px; left: 14px;
      padding: 12px; border: 1px solid #414146; border-radius: 13px;
      background: #1b1b1f; box-shadow: 0 8px 26px #0009;
    }
    .notification { top: 58px; bottom: auto; }
    .notification .row { flex-wrap: wrap; }
    .notification .row > div { display: flex; gap: 7px; align-items: center; }
    .dismiss { border: 0; background: transparent; font-size: 21px; padding: 1px 8px; }
    .scores { margin-top: 9px; }
    .scores button { flex: 1; padding: 8px 5px; }
    .rating-input { margin-top: 10px; }
    dialog {
      width: min(415px, calc(100% - 28px)); color: inherit; background: #17171a;
      border: 1px solid var(--line); border-radius: 17px; padding: 16px;
    }
    #phone-rating { inset: auto 0 14px; margin: 0 auto; }
    dialog::backdrop { background: #0009; }
    .stats h3 { margin-top: 22px; }
    #summary { padding: 13px 0; margin-top: 2px; border-bottom: 1px solid var(--line); }
    #hours, #history { list-style: none; padding: 0; margin: 6px 0 0; }
    #hours { color: var(--muted); font-variant-numeric: tabular-nums; }
    #history li { border-top: 1px solid var(--line); padding: 11px 0; overflow-wrap: anywhere; }
    #history small { color: var(--muted); display: block; margin-top: 3px; font-size: 13px; }
    @media (max-width: 760px) {
      body { padding-inline: 15px; }
      .layout { grid-template-columns: 1fr; }
      .screen { min-height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pause feedback</h1>
    <p>Interactive preview · sample history</p>
  </header>

  <nav class="devices" aria-label="Device">
    <button class="flat" type="button" aria-pressed="true">Laptop</button>
    <button class="flat" type="button" aria-pressed="false">Phone</button>
    <button class="flat" type="button" aria-pressed="false">TV</button>
  </nav>

  <main class="layout">
    <section class="screen" aria-labelledby="pause-title">
      <div class="row">
        <h2 id="pause-title">Pause DNS</h2>
        <span id="network" role="status">DNS on</span>
      </div>

      <form id="pause-form">
        <div class="field">
          <label for="duration">Duration</label>
          <select id="duration">
            <option value="1">1 minute</option>
            <option value="5" selected>5 minutes</option>
            <option value="10">10 minutes</option>
          </select>
        </div>
        <div class="field">
          <span id="check-in-title">Check-in</span>
          <div class="options" role="group" aria-labelledby="check-in-title"></div>
          <button id="tv-picker" type="button" hidden>Check-in</button>
        </div>
        <div class="field">
          <label for="reason">Why?</label>
          <input id="reason" required placeholder="Read the thread on X" autocomplete="off">
        </div>
        <button class="primary" id="start" type="submit" disabled>Pause for 5 minutes</button>
      </form>

      <div class="running" hidden>
        <p id="running-reason"></p>
        <div class="end-actions">
          <button class="primary" type="button" id="end">Turn DNS on</button>
          <button type="button" id="expire">Simulate expiry</button>
        </div>
      </div>

      <section class="toast" aria-label="Laptop rating" hidden></section>
      <section class="notification" aria-label="Phone notification" hidden>
        <div class="row">
          <h3>Was that worth it?</h3>
          <div>
            <button type="button" id="open-rating">Rate</button>
            <button class="dismiss" type="button" id="dismiss-notification" aria-label="Dismiss notification">×</button>
          </div>
        </div>
      </section>
    </section>

    <section class="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">Pause stats</h2>
      <p id="summary" aria-live="polite"></p>
      <h3>Check-ins by hour</h3>
      <ul id="hours"></ul>
      <h3>Recent pauses</h3>
      <ul id="history"></ul>
    </section>
  </main>

  <dialog id="phone-rating" aria-label="Phone rating"></dialog>
  <dialog id="tv-choices" aria-labelledby="tv-title">
    <div class="row">
      <h3 id="tv-title">Check-in</h3>
      <form method="dialog" style="display: block; margin: 0">
        <button class="dismiss" aria-label="Close check-in picker">×</button>
      </form>
    </div>
    <div class="options"></div>
  </dialog>

  <template id="rating-template">
    <div class="row">
      <h3>Was that worth it?</h3>
      <button class="dismiss" type="button" aria-label="Dismiss rating">×</button>
    </div>
    <input class="rating-input" aria-label="Optional note" placeholder="Note" maxlength="200" autocomplete="off">
    <div class="scores" role="group" aria-label="Rating from 1 to 5"></div>
  </template>

  <script>
    const pick = selector => document.querySelector(selector);
    const devices = [...document.querySelectorAll('.devices button')];
    const feelings = ['Tired', 'Bored', 'Stuck', 'Anxious', 'Need something specific'];
    const demoRatings = [1, 2, 2, 1, 2, 1, 2, 2];
    const history = demoRatings.map((score, index) => ({
      device: index % 3 ? 'Laptop' : 'Phone',
      reason: index === 0 ? 'Read the thread on X' : 'Check X',
      checkIn: index < 5 ? 'Bored' : 'Tired',
      minutes: 5,
      hour: index < 5 ? '15:00' : '08:00',
      score,
      note: index === 0 ? 'Nothing relevant today' : '',
    }));
    const sessions = Object.fromEntries(devices.map(button => [button.textContent, {checkIn: '', reason: '', minutes: '5'}]));
    const form = pick('#pause-form');
    const reason = pick('#reason');
    const duration = pick('#duration');
    const toast = pick('.toast');
    const phoneRating = pick('#phone-rating');
    const notification = pick('.notification');
    const tvChoices = pick('#tv-choices');
    let device = 'Laptop';
    const session = () => sessions[device];

    for (const group of [pick('#pause-form .options'), pick('#tv-choices .options')]) {
      for (const feeling of feelings) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'flat';
        button.textContent = feeling;
        button.addEventListener('click', () => {
          session().checkIn = feeling;
          if (tvChoices.open) tvChoices.close();
          render();
        });
        group.append(button);
      }
    }

    function render() {
      const state = session();
      for (const button of devices) button.setAttribute('aria-pressed', button.textContent === device);
      for (const button of document.querySelectorAll('.options button')) {
        button.setAttribute('aria-pressed', button.textContent === state.checkIn);
      }
      pick('#tv-picker').hidden = device !== 'TV';
      pick('#tv-picker').textContent = state.checkIn || 'Check-in';
      pick('#pause-form .options').hidden = device === 'TV';
      form.hidden = Boolean(state.active);
      pick('.running').hidden = !state.active;
      pick('#network').textContent = state.active ? 'DNS paused' : 'DNS on';
      pick('#network').toggleAttribute('data-paused', Boolean(state.active));
      pick('#running-reason').textContent = state.active?.reason || '';
      pick('#pause-title').textContent = device === 'TV' ? 'Pause NextDNS' : 'Pause DNS';
      pick('#start').disabled = !state.checkIn || state.reason.trim().length < 3;
      pick('#start').textContent = 'Pause for ' + duration.selectedOptions[0].textContent;
      toast.hidden = device !== 'Laptop' || !state.pending;
      notification.hidden = device !== 'Phone' || !state.pending || phoneRating.open;
      renderStats();
    }

    function listItem(list, text, detail) {
      const item = document.createElement('li');
      item.textContent = text;
      if (detail) {
        const small = document.createElement('small');
        small.textContent = detail;
        item.append(small);
      }
      list.append(item);
    }

    function renderStats() {
      const rated = history.filter(row => row.score).slice(0, 8);
      const average = rated.reduce((sum, row) => sum + row.score, 0) / rated.length;
      pick('#summary').textContent = `Last ${rated.length} rated pauses ending on x.com averaged ${average.toFixed(1)}/5`;
      const hourly = new Map();
      for (const row of history) {
        if (!hourly.has(row.hour)) hourly.set(row.hour, new Map());
        const counts = hourly.get(row.hour);
        counts.set(row.checkIn, (counts.get(row.checkIn) || 0) + 1);
      }
      const hours = pick('#hours');
      hours.replaceChildren();
      for (const [hour, counts] of [...hourly].sort()) {
        listItem(hours, `${hour} · ${[...counts].map(([name, count]) => `${name} ×${count}`).join(', ')}`);
      }
      const recent = pick('#history');
      recent.replaceChildren();
      for (const row of history.slice(0, 3)) {
        listItem(recent, row.reason, [
          row.device, row.minutes + 'm', row.checkIn, row.score && row.score + '/5', row.note,
        ].filter(Boolean).join(' · '));
      }
    }

    function dismissRating(target) {
      sessions[target].pending = null;
      if (target === 'Phone' && phoneRating.open) phoneRating.close();
      render();
    }

    function setupRating(surface, target) {
      surface.append(pick('#rating-template').content.cloneNode(true));
      const note = surface.querySelector('input');
      surface.querySelector('.dismiss').addEventListener('click', () => dismissRating(target));
      if (target === 'Phone') {
        surface.addEventListener('cancel', () => dismissRating(target));
      }
      for (let score = 1; score <= 5; score++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = score;
        button.setAttribute('aria-label', score + ' out of 5');
        button.addEventListener('click', () => {
          const pause = sessions[target].pending;
          if (!pause) return;
          pause.score = score;
          pause.note = note.value.trim();
          dismissRating(target);
        });
        surface.querySelector('.scores').append(button);
      }
    }

    function endPause() {
      const state = session();
      const pause = state.active;
      if (!pause) return;
      history.unshift(pause);
      state.active = null;
      if (device !== 'TV') {
        const target = device;
        state.pending = pause;
        (target === 'Phone' ? phoneRating : toast).querySelector('input').value = '';
        setTimeout(() => {
          if (state.pending === pause) dismissRating(target);
        }, 10 * 60 * 1000);
      }
      render();
    }

    devices.forEach(button => button.addEventListener('click', () => {
      device = button.textContent;
      reason.value = session().reason;
      duration.value = session().minutes;
      render();
    }));
    pick('#tv-picker').addEventListener('click', () => tvChoices.showModal());
    pick('#open-rating').addEventListener('click', () => {
      phoneRating.showModal();
      render();
    });
    pick('#dismiss-notification').addEventListener('click', () => dismissRating('Phone'));
    reason.addEventListener('input', () => {
      session().reason = reason.value;
      render();
    });
    duration.addEventListener('change', () => {
      session().minutes = duration.value;
      render();
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const state = session();
      if (!state.checkIn || state.reason.trim().length < 3) return;
      if (state.pending) dismissRating(device);
      state.active = {
        device, reason: state.reason.trim(), checkIn: state.checkIn, minutes: state.minutes,
        hour: new Date().getHours().toString().padStart(2, '0') + ':00',
      };
      state.reason = reason.value = '';
      state.checkIn = '';
      render();
    });
    pick('#end').addEventListener('click', endPause);
    pick('#expire').addEventListener('click', endPause);
    setupRating(toast, 'Laptop');
    setupRating(phoneRating, 'Phone');
    render();
  </script>
</body>
</html>
